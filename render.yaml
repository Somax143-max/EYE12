services:
  - type: web
    name: drishti-ai-backend
    env: python
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DRISHTI_ENV
        value: production
      - key: RURAL_EDGE_MODE
        value: "true"
      - key: DRISHTI_SECRET_KEY
        generateValue: true

